[build-system]
requires = ["setuptools>=61.0","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rami2d"
dynamic = ["version"]
authors = [
    {name = "Victor Perez", email = "vdpm85@hotmail.com"}
]
license = {text = "BSD-3-Clause"}
description = "Registration of two multi-channel images via itk-elastix. Suitable for registering multi-modal and/or multi-scale data sets"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License"
]
requires-python = ">=3.11"
dependencies = [
    "tifffile==2025.6.11",
    "ome-types==0.6.1",
    "scikit-image==0.25.2",
    "pandas==2.2.2",
    "matplotlib==3.10.8",
    "itk-elastix==0.23.0",
    "openslide-python==1.4.2",
    "openslide-bin==4.0.0.8"
]
keywords = [
    "registration",
    "microscopy",
    "pathology",
    "multiplexed",
    "immunofluorescence",
    "multi-channel",
    "SIFT",
    "RANSAC"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rami2d" = ["maps/*"]

[tool.setuptools.dynamic]
version = { attr = "rami2d.version.__version__" }


[project.scripts]
rami2d-register = "rami2d.register:main"
rami2d-transform = "rami2d.transform:main"



[project.urls]
Homepage = "https://github.com/VictorDidier/RAMI2D"
Issues = "https://github.com/VictorDidier/RAMI2D/issues"